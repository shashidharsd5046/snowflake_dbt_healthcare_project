version: 2

models:
  - name: mart_condition_cost_by_payer
    description: >
      Healthcare mart showing total procedure cost by procedure grouped by payer.
      Grain: one row per payer + procedure combination.
    columns:
      - name: payer_name
        tests:
          - not_null
      - name: procedure_code
        tests:
          - not_null
      - name: procedure_description
        tests:
          - not_null
      - name: total_patients
        tests:
          - not_null
      - name: total_procedures
        tests:
          - not_null
      - name: total_cost
        tests:
          - not_null

  - name: mart_patient_procedure_summary
    description: >
      Healthcare mart summarizing procedure count, total procedure cost, and average cost per patient.
      Grain: One row per patient.
    columns:
      - name: patient_id
        tests:
          - unique
          - not_null
      - name: first_name
        tests:
          - not_null
      - name: last_name
        tests:
          - not_null
      - name: total_procedures
        tests:
          - not_null
      - name: total_procedure_cost
        tests:
          - not_null
      - name: avg_procedure_cost
        tests:
          - not_null

  - name: mart_payer_procedure_cost_summary
    description: >
      Healthcare mart summarizing total procedures, total cost, and average procedure cost
      grouped by insurance payer. Grain: One row per payer.
    columns:
      - name: payer_name
        tests:
          - not_null
      - name: total_patients
        tests:
          - not_null
      - name: total_procedures
        tests:
          - not_null
      - name: total_procedure_cost
        tests:
          - not_null
      - name: avg_procedure_cost
        tests:
          - not_null
      - name: min_procedure_cost
        tests:
          - not_null
      - name: max_procedure_cost
        tests:
          - not_null
